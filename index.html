<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Log In</h2>

    <input id="email" type="email" placeholder="Email" /><br /><br />
    <input id="password" type="password" placeholder="Password" /><br /><br />

    <button id="login-btn">Log In</button>
    <button id="signup-btn">Sign Up (new account)</button>

    <p id="status"></p>
    <button id="logout-btn">Log Out</button>

    <hr />
    <!--ADD-ACCOUNTS-->
    <!-- Your existing accounts list area -->
    <div id="accounts-section">
      <button id="open-add-account-btn">+ Add Account</button>
      <div id="accounts-list"></div>
    </div>

    <!-- The modal, hidden by default -->
    <div id="add-account-modal" class="modal hidden">
      <div class="modal-content">
        <h2>New Account</h2>
        <input type="text" id="new-account-name" placeholder="Account name" />
        <br /><br />
        <select id="new-account-type">
          <option value="cash">Cash</option>
          <option value="debit" selected>Debit</option>
          <option value="savings">Savings</option>
        </select>
        <br /><br />
        <input
          type="text"
          id="new-account-description"
          placeholder="Description (optional)"
        />
        <br /><br />
        <input
          type="number"
          id="new-account-balance"
          step="0.01"
          placeholder="Starting balance (+/-, optional)"
        />
        <div class="modal-buttons">
          <button id="save-account-btn">Save</button>
          <button id="cancel-account-btn">Cancel</button>
        </div>
        <p id="account-status"></p>
      </div>
    </div>

    <hr />
    <!--ADD-TRANSACTIONS-->
    <h2>Add Transaction</h2>
    <input
      id="tx-amount"
      type="number"
      step="0.01"
      placeholder="Amount (use - for expenses)"
    />
    <br /><br />
    <input id="tx-title" type="text" placeholder="Title" /><br /><br />
    <input id="tx-date" type="date" /><br /><br />
    <input
      id="tx-description"
      type="text"
      placeholder="Description"
    /><br /><br />
    <select id="tx-account"></select>
    <br /><br />
    <button id="add-tx-btn">Add Transaction</button>
    <p id="tx-status"></p>

    <hr />
    <!--TRANSACTIONS-LIST-->
    <h2>Your Transactions</h2>
    <button id="refresh-btn">Refresh</button>
    <p id="balance"></p>
    <ul id="tx-list"></ul>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // PASTE YOUR OWN VALUES HERE
      const SUPABASE_URL = "https://sxohsjpbfnkkhqodzesp.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_jeDd30lzuA2LOYFqs3t2Yw_Pv1J-GoA";

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
      }
      //Gets rid of Fetch - "VFetch event handler is recognized as no-op. No-op fetch handler may bring overhead during navigation. Consider removing the handler if possible.""
      self.addEventListener("install", () => {
        self.skipWaiting();
      });
      self.addEventListener("activate", () => {
        self.clients.claim();
      });

      //Log-In - V0
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const status = document.getElementById("status");

      document
        .getElementById("signup-btn")
        .addEventListener("click", async () => {
          const { error } = await supabaseClient.auth.signUp({
            email: emailInput.value,
            password: passwordInput.value,
          });
          status.textContent = error
            ? error.message
            : "Account created! Check your email if confirmation is required, then log in.";
        });

      document
        .getElementById("login-btn")
        .addEventListener("click", async () => {
          const { error } = await supabaseClient.auth.signInWithPassword({
            email: emailInput.value,
            password: passwordInput.value,
          });
          status.textContent = error ? error.message : "Logged in!";
        });

      document
        .getElementById("logout-btn")
        .addEventListener("click", async () => {
          await supabaseClient.auth.signOut();
          document.getElementById("tx-list").innerHTML = "";
          document.getElementById("balance").textContent = "";
        });

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          status.textContent = "Logged in as " + session.user.email;
        } else {
          status.textContent = "Logged out";
        }
      });

      //Transaction Functions - v1
      document
        .getElementById("add-tx-btn")
        .addEventListener("click", async () => {
          const amount = parseFloat(document.getElementById("tx-amount").value);
          const title = document.getElementById("tx-title").value;
          const description = document.getElementById("tx-description").value;
          const date = document.getElementById("tx-date").value;
          const accountId = document.getElementById("tx-account").value;
          const txStatus = document.getElementById("tx-status");

          const { error } = await supabaseClient.from("transactions").insert({
            amount: amount,
            title: title,
            description: description,
            occurred_on: date,
            account_id: accountId,
          });

          txStatus.textContent = error ? error.message : "Transaction added!";
        });

      async function loadAccounts() {
        const { data, error } = await supabaseClient
          .from("accounts")
          .select("*, transactions(amount)");

        const accountsList = document.getElementById("accounts-list");
        const txAccountSelect = document.getElementById("tx-account");
        accountsList.innerHTML = "";
        txAccountSelect.innerHTML = "";

        if (error) {
          console.error(error);
          return;
        }

        data.forEach((account) => {
          const balance = account.transactions.reduce(
            (sum, t) => sum + parseFloat(t.amount),
            0,
          );

          const div = document.createElement("div");
          div.textContent =
            account.name + " - " + account.type + ": $" + balance.toFixed(2);
          accountsList.appendChild(div);

          const option = document.createElement("option");
          option.value = account.id;
          option.textContent = account.name;
          txAccountSelect.appendChild(option);
        });
      }

      async function loadTransactions() {
        const { data, error } = await supabaseClient
          .from("transactions")
          .select("*, accounts(name)")
          .order("occurred_on", { ascending: false });

        if (error) {
          document.getElementById("balance").textContent = error.message;
          return;
        }

        const balance = data.reduce((sum, t) => sum + parseFloat(t.amount), 0);
        document.getElementById("balance").textContent =
          "Balance: " + balance.toFixed(2);

        const list = document.getElementById("tx-list");
        list.innerHTML = "";
        data.forEach((t) => {
          const li = document.createElement("li");
          const accountName = t.accounts ? t.accounts.name : "General";
          li.textContent =
            t.occurred_on +
            " - " +
            accountName +
            " - " +
            t.title +
            ": $" +
            t.amount;
          list.appendChild(li);
        });
      }

      document
        .getElementById("refresh-btn")
        .addEventListener("click", loadTransactions);

      async function checkSession() {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();
        if (session) {
          status.textContent = "Logged in as " + session.user.email;
          loadTransactions();
          loadAccounts();
        }
      }

      //Accounts Functions - V2
      const modal = document.getElementById("add-account-modal");

      function openAccountModal() {
        modal.classList.remove("hidden");
      }

      function closeAccountModal() {
        modal.classList.add("hidden");
        document.getElementById("new-account-name").value = "";
      }
      //FURTURE-ERROR-POSSIBLE
      async function saveAccount() {
        const name = document.getElementById("new-account-name").value;
        const type = document.getElementById("new-account-type").value;
        const description = document.getElementById(
          "new-account-description",
        ).value;
        const balance =
          parseFloat(document.getElementById("new-account-balance").value) || 0;
        const accountStatus = document.getElementById("account-status");

        const { data, error } = await supabaseClient
          .from("accounts")
          .insert({
            name: name,
            type: type,
            description: description,
          })
          .select();

        if (error) {
          accountStatus.textContent = error.message;
          return;
        }

        const newAccountId = data[0].id;

        if (balance !== 0) {
          const today = new Date().toISOString().split("T")[0];

          const { error: txError } = await supabaseClient
            .from("transactions")
            .insert({
              amount: balance,
              title: "Starting Balance",
              occurred_on: today,
              account_id: newAccountId,
            });

          if (txError) {
            accountStatus.textContent = txError.message;
            return;
          }
        }

        accountStatus.textContent = "Account added!";
        document.getElementById("new-account-name").value = "";
        document.getElementById("new-account-description").value = "";
        document.getElementById("new-account-balance").value = "";
        modal.classList.add("hidden");
        loadAccounts();
      }

      document
        .getElementById("open-add-account-btn")
        .addEventListener("click", openAccountModal);

      document
        .getElementById("cancel-account-btn")
        .addEventListener("click", closeAccountModal);

      document
        .getElementById("save-account-btn")
        .addEventListener("click", saveAccount);

      //ONLY ON REFRESH
      document.getElementById("tx-date").valueAsDate = new Date();

      checkSession();
    </script>
  </body>
</html>
